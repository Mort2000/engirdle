# Alembic configuration for CLI/development use (e.g. `alembic revision --autogenerate`).
# At runtime the application builds the Config programmatically (see
# src/engirdle_pc/shared/infrastructure/database/migrations_runner.py) and injects
# the Engine via config.attributes, so the URL here is unused at runtime.
[alembic]
script_location = src/engirdle_pc/shared/infrastructure/database/alembic
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
