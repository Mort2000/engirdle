{% extends "base.html" %}
{% block title %}录入文章 · Engirdle{% endblock %}
{% block content %}
<section class="page-heading"><p class="eyebrow">STEP 1 · SOURCE</p><h1>录入英文 Markdown</h1><p>支持 GFM 子集：标题、段落、列表、引用、强调、链接、行内代码、表格、代码块与分隔线。代码块内容只在本地处理，永不发送给 LLM 或 TTS。原始输入和规范化文本会分别保存；可翻译文本只在接入真实翻译适配器后发送给 DeepSeek。</p></section>
<form class="panel form" action="/articles" method="post">
  <label>标题 <input name="title" required maxlength="512" autofocus></label>
  <label>英文 Markdown <textarea name="body" required rows="18" placeholder="Paste Markdown: headings, paragraphs, lists, quotes, tables and fenced code blocks…"></textarea></label>
  <div class="grid two"><label>作者（可选）<input name="author"></label><label>来源名称（可选）<input name="source_name"></label></div>
  <div class="grid two"><label>来源 URL（可选）<input name="source_url" type="url"></label><label>许可说明 <input name="license_name" value="unknown" required></label></div>
  <div class="actions"><a href="/">取消</a><button type="submit">保存并生成候选结构</button></div>
</form>
{% endblock %}
