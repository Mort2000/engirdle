[project]
name = "engirdle-pc"
version = "0.1.0"
description = "Local-first PC content production application for Engirdle"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.116,<1",
  "imageio-ffmpeg>=0.6,<1",
  "jsonschema[format]>=4.25,<5",
  # Frozen GFM-subset markdown parser (content module, engirdle-gfm@1).
  # Upgrading it changes the AST projection and requires a PARSE_VERSION bump.
  "markdown-it-py>=3,<5",
  "openai>=1.50,<2",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "sse-starlette>=2.2,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
# Real Qwen3-TTS runtime for the production speech adapters. Tests and plain
# builds never import it; only the admin/worker entrypoints require it.
tts = [
  # onnxruntime 1.24+ publishes no cp310 wheels; cap it so uv can resolve a
  # Python 3.10-compatible build (qwen-tts leaves the version unpinned).
  "onnxruntime>=1.22,<1.24",
  # Without lower bounds uv backtracks librosa's numba/llvmlite chain to
  # ancient sdists that cannot build; these ranges still support Python 3.10.
  "llvmlite>=0.44,<0.45",
  "numba>=0.61,<0.62",
  "qwen-tts>=0.1.1,<0.2",
  "soundfile>=0.13,<1",
]

[project.scripts]
engirdle-pc = "engirdle_pc.entrypoints.cli.main:main"
engirdle-pc-worker = "engirdle_pc.entrypoints.worker.main:main"
engirdle-dictionary-builder = "engirdle_pc.entrypoints.dictionary_builder.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engirdle_pc"]

# The sdist must stay source-only: local scratch output never ships, and the
# admin frontend is pruned wholesale (node_modules, dist, caches) because the
# build hook (hatch_build.py) force-includes exactly the enumerated frontend
# sources needed to rebuild the web UI from the sdist (design §10).
[tool.hatch.build.targets.sdist]
exclude = [
  ".scratch",
  "admin_frontend",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["engirdle_pc"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
# Alembic env.py and version scripts use dynamic module-level state (revision,
# down_revision, the `op` proxy) that does not type-check under strict mode.
exclude = "engirdle_pc/shared/infrastructure/database/alembic/"

[[tool.mypy.overrides]]
module = ["qwen_tts.*", "torch.*", "soundfile.*", "numpy.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
