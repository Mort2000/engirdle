# 本机为 WSL（8 GB RAM），默认值 -Xmx8G 会超过物理内存引发 swap 风暴；
# 将守护进程堆、Kotlin 守护进程堆与 worker 数限制到与机器匹配的预算。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Opt in to the dataSync foreground-service type for long-running background
# translation workers (design §9.2). This swaps in workmanager_android's
# opt-in manifest, which declares FOREGROUND_SERVICE_DATA_SYNC and types the
# SystemForegroundService. It is a Play Console "special type": before any
# Play distribution, complete the dataSync declaration.
workmanager.enableDataSyncForegroundService=true
